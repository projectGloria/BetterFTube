<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#181b24"/>
    </linearGradient>
    <linearGradient id="red-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <linearGradient id="toggle-on" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#ff5c5c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="500" rx="16" fill="url(#bg-grad)" stroke="#272c3d" stroke-width="1.5"/>

  <!-- Window Chrome Header -->
  <rect x="0" y="0" width="960" height="42" rx="16" fill="#141721"/>
  <rect x="0" y="32" width="960" height="10" fill="#141721"/>
  <line x1="0" y1="42" x2="960" y2="42" stroke="#262b3a" stroke-width="1"/>
  <circle cx="24" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="5.5" fill="#27c93f"/>
  <text x="480" y="26" fill="#8e99b0" font-size="12" text-anchor="middle" font-weight="500" class="sans">BetterFTube v2.0 — Decluttered YouTube Interface</text>

  <!-- Left: YouTube Feed (Before vs After Concept) -->
  <g transform="translate(36, 64)">
    <!-- Sub-window outline -->
    <rect width="520" height="396" rx="10" fill="#0d0e15" stroke="#252a3b" stroke-width="1"/>
    
    <!-- Mini YT Top Bar -->
    <rect width="520" height="36" rx="10" fill="#151722"/>
    <rect y="26" width="520" height="10" fill="#151722"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#242938" stroke-width="1"/>
    
    <!-- Logo & search bar mock -->
    <rect x="16" y="11" width="22" height="14" rx="4" fill="#ff3b3b"/>
    <polygon points="23,14 31,18 23,22" fill="#ffffff"/>
    <text x="44" y="23" fill="#ffffff" font-size="12" font-weight="700" class="sans">YouTube</text>
    <rect x="140" y="8" width="220" height="20" rx="10" fill="#202433" stroke="#2f364a" stroke-width="1"/>
    <text x="156" y="22" fill="#69758d" font-size="10" class="sans">Search</text>
    
    <!-- Left Navigation Bar Mock -->
    <rect x="0" y="36" width="54" height="360" fill="#11131c"/>
    <line x1="54" y1="36" x2="54" y2="396" stroke="#202434" stroke-width="1"/>
    <!-- Nav Icons -->
    <rect x="18" y="52" width="18" height="12" rx="3" fill="#ff3b3b" opacity="0.9"/>
    <rect x="18" y="76" width="18" height="12" rx="3" fill="#444b63"/>
    <rect x="18" y="100" width="18" height="12" rx="3" fill="#444b63"/>
    <!-- Blocked Shorts tag indicator -->
    <line x1="14" y1="130" x2="40" y2="130" stroke="#ff3b3b" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <text x="27" y="142" fill="#ff5c5c" font-size="8" text-anchor="middle" font-weight="600" class="sans">BLOCKED</text>

    <!-- Content Area: Clean Grid without Clutter -->
    <!-- Removed Chip Bar Notification -->
    <rect x="70" y="48" width="434" height="22" rx="4" fill="#181d2a" stroke="#2d3548" stroke-width="1"/>
    <text x="82" y="63" fill="#38d39f" font-size="9.5" font-weight="600" class="sans">✨ Category chips, Shorts shelves, and banner promos cleaned automatically</text>

    <!-- Video Cards (Clean 2-column grid) -->
    <!-- Card 1 -->
    <g transform="translate(70, 84)">
      <rect width="208" height="116" rx="6" fill="#1a1e2c" stroke="#2a3144" stroke-width="1"/>
      <rect x="0" y="0" width="208" height="80" rx="6" fill="#282e42"/>
      <rect x="164" y="60" width="36" height="14" rx="3" fill="#0c0e14" opacity="0.85"/>
      <text x="182" y="71" fill="#fff" font-size="9" text-anchor="middle" font-weight="600" class="mono">14:28</text>
      <circle cx="16" cy="98" r="10" fill="#3d4663"/>
      <rect x="34" y="90" width="150" height="8" rx="2" fill="#e2e8f0"/>
      <rect x="34" y="102" width="90" height="6" rx="2" fill="#717d9a"/>
    </g>

    <!-- Card 2 -->
    <g transform="translate(296, 84)">
      <rect width="208" height="116" rx="6" fill="#1a1e2c" stroke="#2a3144" stroke-width="1"/>
      <rect x="0" y="0" width="208" height="80" rx="6" fill="#282e42"/>
      <rect x="168" y="60" width="32" height="14" rx="3" fill="#0c0e14" opacity="0.85"/>
      <text x="184" y="71" fill="#fff" font-size="9" text-anchor="middle" font-weight="600" class="mono">8:45</text>
      <circle cx="16" cy="98" r="10" fill="#3d4663"/>
      <rect x="34" y="90" width="140" height="8" rx="2" fill="#e2e8f0"/>
      <rect x="34" y="102" width="100" height="6" rx="2" fill="#717d9a"/>
    </g>

    <!-- Card 3 -->
    <g transform="translate(70, 214)">
      <rect width="208" height="116" rx="6" fill="#1a1e2c" stroke="#2a3144" stroke-width="1"/>
      <rect x="0" y="0" width="208" height="80" rx="6" fill="#282e42"/>
      <rect x="164" y="60" width="36" height="14" rx="3" fill="#0c0e14" opacity="0.85"/>
      <text x="182" y="71" fill="#fff" font-size="9" text-anchor="middle" font-weight="600" class="mono">22:04</text>
      <circle cx="16" cy="98" r="10" fill="#3d4663"/>
      <rect x="34" y="90" width="160" height="8" rx="2" fill="#e2e8f0"/>
      <rect x="34" y="102" width="80" height="6" rx="2" fill="#717d9a"/>
    </g>

    <!-- Card 4 -->
    <g transform="translate(296, 214)">
      <rect width="208" height="116" rx="6" fill="#1a1e2c" stroke="#2a3144" stroke-width="1"/>
      <rect x="0" y="0" width="208" height="80" rx="6" fill="#282e42"/>
      <rect x="168" y="60" width="32" height="14" rx="3" fill="#0c0e14" opacity="0.85"/>
      <text x="184" y="71" fill="#fff" font-size="9" text-anchor="middle" font-weight="600" class="mono">5:12</text>
      <circle cx="16" cy="98" r="10" fill="#3d4663"/>
      <rect x="34" y="90" width="130" height="8" rx="2" fill="#e2e8f0"/>
      <rect x="34" y="102" width="75" height="6" rx="2" fill="#717d9a"/>
    </g>

    <!-- Bottom info strip -->
    <rect x="70" y="346" width="434" height="36" rx="6" fill="#12151e" stroke="#222838" stroke-width="1"/>
    <circle cx="90" cy="364" r="7" fill="#22c55e" opacity="0.2"/>
    <circle cx="90" cy="364" r="3.5" fill="#22c55e"/>
    <text x="108" y="368" fill="#a5b3cf" font-size="10" class="sans"><tspan font-weight="600" fill="#ffffff">Watch Page &amp; Feed:</tspan> Clickbait, Shorts, Recommendations &amp; Promos hidden</text>
  </g>

  <!-- Right: BetterFTube Extension Popup UI -->
  <g transform="translate(584, 60)" filter="url(#shadow)">
    <!-- Popup Card -->
    <rect width="338" height="408" rx="14" fill="url(#panel-grad)" stroke="#ff3b3b" stroke-width="1.8"/>
    
    <!-- Popup Header -->
    <rect width="338" height="54" rx="14" fill="#232738"/>
    <rect y="44" width="338" height="10" fill="#232738"/>
    <line x1="0" y1="54" x2="338" y2="54" stroke="#2e354a" stroke-width="1"/>

    <!-- BetterFTube Icon in Header -->
    <rect x="16" y="12" width="32" height="28" rx="8" fill="url(#red-accent)"/>
    <polygon points="28,19 39,26 28,33" fill="#ffffff"/>
    <line x1="25" y1="24" x2="35" y2="24" stroke="#ff3b3b" stroke-width="1.5"/>
    <line x1="25" y1="28" x2="35" y2="28" stroke="#ff3b3b" stroke-width="1.5"/>

    <text x="56" y="27" fill="#ffffff" font-size="14" font-weight="700" class="sans">BetterFTube</text>
    <text x="56" y="40" fill="#8f9bb3" font-size="9.5" font-weight="500" class="sans">v2.0 • Distraction Free</text>

    <!-- Master Switch Indicator -->
    <rect x="254" y="16" width="68" height="22" rx="11" fill="#1b4d32" stroke="#22c55e" stroke-width="1"/>
    <circle cx="309" cy="27" r="7" fill="#22c55e"/>
    <text x="278" y="31" fill="#4ade80" font-size="9.5" font-weight="700" class="sans">ON</text>

    <!-- Presets bar -->
    <g transform="translate(16, 66)">
      <rect width="306" height="28" rx="6" fill="#161822" stroke="#2b3145" stroke-width="1"/>
      <!-- Active Focus Preset -->
      <rect x="2" y="2" width="98" height="24" rx="4" fill="#252a3c"/>
      <text x="51" y="18" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="600" class="sans">Default</text>
      <rect x="104" y="2" width="98" height="24" rx="4" fill="url(#red-accent)"/>
      <text x="153" y="18" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="700" class="sans">★ Focus</text>
      <text x="255" y="18" fill="#7d8aa5" font-size="10" text-anchor="middle" font-weight="500" class="sans">Custom</text>
    </g>

    <!-- Toggles List -->
    <g transform="translate(16, 106)">
      <!-- Toggle 1: Hide Shorts -->
      <g transform="translate(0, 0)">
        <rect width="306" height="42" rx="8" fill="#181b26" stroke="#272d40" stroke-width="1"/>
        <text x="14" y="20" fill="#ffffff" font-size="11" font-weight="600" class="sans">Hide Shorts (everywhere)</text>
        <text x="14" y="33" fill="#75829e" font-size="9" class="sans">Feed, shelves, search, channel tab</text>
        <rect x="256" y="11" width="38" height="20" rx="10" fill="url(#toggle-on)"/>
        <circle cx="282" cy="21" r="7" fill="#ffffff"/>
      </g>

      <!-- Toggle 2: Open Shorts in Normal Player -->
      <g transform="translate(0, 48)">
        <rect width="306" height="42" rx="8" fill="#181b26" stroke="#272d40" stroke-width="1"/>
        <text x="14" y="20" fill="#ffffff" font-size="11" font-weight="600" class="sans">Open Shorts in normal player</text>
        <text x="14" y="33" fill="#75829e" font-size="9" class="sans">/shorts/ID → /watch?v=ID with seek bar</text>
        <rect x="256" y="11" width="38" height="20" rx="10" fill="url(#toggle-on)"/>
        <circle cx="282" cy="21" r="7" fill="#ffffff"/>
      </g>

      <!-- Toggle 3: Hide Comments & Suggestions -->
      <g transform="translate(0, 96)">
        <rect width="306" height="42" rx="8" fill="#181b26" stroke="#272d40" stroke-width="1"/>
        <text x="14" y="20" fill="#ffffff" font-size="11" font-weight="600" class="sans">Hide comments &amp; related videos</text>
        <text x="14" y="33" fill="#75829e" font-size="9" class="sans">Eliminate distraction loops</text>
        <rect x="256" y="11" width="38" height="20" rx="10" fill="url(#toggle-on)"/>
        <circle cx="282" cy="21" r="7" fill="#ffffff"/>
      </g>

      <!-- Toggle 4: Remember Speed per Channel -->
      <g transform="translate(0, 144)">
        <rect width="306" height="42" rx="8" fill="#181b26" stroke="#272d40" stroke-width="1"/>
        <text x="14" y="20" fill="#ffffff" font-size="11" font-weight="600" class="sans">Remember speed per channel</text>
        <text x="14" y="33" fill="#75829e" font-size="9" class="sans">Lecture channels 2x, music 1x</text>
        <rect x="256" y="11" width="38" height="20" rx="10" fill="url(#toggle-on)"/>
        <circle cx="282" cy="21" r="7" fill="#ffffff"/>
      </g>

      <!-- Toggle 5: Interactive Element Picker -->
      <g transform="translate(0, 192)">
        <rect width="306" height="42" rx="8" fill="#1a1e2d" stroke="#37415c" stroke-width="1"/>
        <text x="14" y="20" fill="#60a5fa" font-size="11" font-weight="600" class="sans">🎯 Pick Element (Alt+Shift+H)</text>
        <text x="14" y="33" fill="#75829e" font-size="9" class="sans">Point &amp; click to create instant toggle</text>
        <rect x="252" y="11" width="42" height="20" rx="4" fill="#29334c"/>
        <text x="273" y="25" fill="#93c5fd" font-size="9.5" text-anchor="middle" font-weight="600" class="sans">Pick</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <rect y="366" width="338" height="42" rx="14" fill="#141722"/>
    <line x1="0" y1="366" x2="338" y2="366" stroke="#262c3e" stroke-width="1"/>
    <circle cx="24" cy="387" r="4" fill="#22c55e"/>
    <text x="36" y="390" fill="#8f9bb3" font-size="9.5" class="sans">Zero network requests • Manifest V3 • Pure CSS Gated</text>
  </g>
</svg>
